- name: Generate OTTPlus playlist
  env:
    OTTPLUS_API_URL: ${{ secrets.OTTPLUS_API_URL }}
  run: |
    echo "Starting ottplus.py..."
    python ottplus.py
    echo "Python finished with exit code: $?"

- name: Debug output
  if: always()
  run: |
    echo "========== DIRECTORY =========="
    pwd
    ls -lah

    echo "========== M3U8 CHECK =========="

    if [ -f "ottplus.m3u8" ]; then
      echo "FOUND: ottplus.m3u8"
      ls -lh ottplus.m3u8
      echo "----- PLAYLIST -----"
      head -30 ottplus.m3u8
    else
      echo "NOT FOUND: ottplus.m3u8"
    fifi
