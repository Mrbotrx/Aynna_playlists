name: OTTPlus Playlist Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate OTTPlus playlist
        env:
          OTTPLUS_API_URL: ${{ secrets.OTTPLUS_API_URL }}
        run: |
          python ottplus.py

      - name: Check generated files
        run: |
          echo "Current directory:"
          pwd

          echo "Files:"
          ls -lah

          echo "Checking playlist..."

          if [ ! -f "ottplus.m3u8" ]; then
            echo "ERROR: ottplus.m3u8 was not generated."
            exit 1
          fi

          echo "ottplus.m3u8 found:"
          ls -lh ottplus.m3u8

          echo "First lines:"
          head -20 ottplus.m3u8

      - name: Commit and push playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ottplus.m3u8

          if git diff --cached --quiet; then
            echo "No playlist changes."
            exit 0
          fi

          git commit -m "Update OTTPlus playlist"
          git push
