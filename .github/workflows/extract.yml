
name: Special KBC Playlist Update

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: special-kbc-playlist
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Run extractor
        run: python -u ./Special_KBC.py

      - name: Verify playlist
        run: |
          echo "Repository: $GITHUB_WORKSPACE"
          echo "Generated playlist:"

          if [ ! -f "$GITHUB_WORKSPACE/Special_KBC.m3u" ]; then
            echo "::error::Special_KBC.m3u does not exist."
            exit 1
          fi

          if ! head -n 1 Special_KBC.m3u | grep -qx '#EXTM3U'; then
            echo "::error::Invalid M3U header."
            exit 1
          fi

          echo "Playlist file exists."
          echo "URL count:"
          tail -n +2 Special_KBC.m3u | grep -c . || true

      - name: Commit and push playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- Special_KBC.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Special_KBC.m3u"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
