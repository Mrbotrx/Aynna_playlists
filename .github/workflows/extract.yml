
name: Special KBC Playlist

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: special-kbc
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Run extractor
        run: python -u Special_KBC.py

      - name: Verify output
        run: |
          test -f Special_KBC.m3u
          head -n 1 Special_KBC.m3u | grep -qx '#EXTM3U'
          echo "Playlist verified."
          echo "Media URL count:"
          tail -n +2 Special_KBC.m3u | grep -c . || true

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: special-kbc-debug
          path: extract_debug.txt
          if-no-files-found: ignore

      - name: Commit playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- Special_KBC.m3u

          if ! git diff --cached --quiet; then
            git commit -m "Update Special_KBC.m3u"
            git push
          else
            echo "No playlist changes."
          fi
