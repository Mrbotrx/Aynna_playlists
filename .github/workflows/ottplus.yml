name: OTTPLUS Update

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"


jobs:

  ottplus:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Python setup
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"


    - name: Install
      run: |
        pip install requests


    - name: Run OTT
      env:
        API_URL_ottplus: ${{ secrets.API_URL_ottplus }}
        API_KEY: ${{ secrets.API_KEY }}
      run: |
        python ott.py
