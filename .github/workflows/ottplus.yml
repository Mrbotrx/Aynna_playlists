name: OTTPLUS Update

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"


jobs:

  ottplus:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"


    - name: Install
      run: |
        pip install requests


    - name: Generate playlist
      env:
        API_URL_ottplus: ${{ secrets.API_URL_ottplus }}
        API_KEY: ${{ secrets.API_KEY }}
      run: |
        python ott.py


    - name: Check output
      run: |
        ls -la
        if [ -f OTTPLUS.m3u8 ]; then
          echo "OTTPLUS.m3u8 created"
          wc -l OTTPLUS.m3u8
        else
          echo "OTTPLUS.m3u8 missing"
          exit 1
        fi


    - name: Commit
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"

        git add OTTPLUS.m3u8

        git commit -m "Update OTTPLUS playlist" || true

        git push
