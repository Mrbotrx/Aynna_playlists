name: OTTPLUS Auto Update

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"


jobs:

  ottplus:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"


    - name: Install dependencies
      run: |
        pip install -r requirements.txt


    - name: Run OTT generator
      env:
        API_URL_ottplus: ${{ secrets.API_URL_ottplus }}
        API_KEY: ${{ secrets.API_KEY }}
      run: |
        python ott.py


    - name: Verify playlist
      run: |
        echo "Checking files..."
        ls -la

        if [ ! -f OTTPLUS.m3u8 ]; then
          echo "ERROR: OTTPLUS.m3u8 not found"
          exit 1
        fi

        echo "OTTPLUS.m3u8 created successfully"
        wc -l OTTPLUS.m3u8


    - name: Commit playlist
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"

        git add OTTPLUS.m3u8

        git commit -m "Auto update OTTPLUS playlist" || echo "No changes"

        git push
