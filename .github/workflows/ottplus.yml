name: OTTPLUS Update

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"


jobs:

  ottplus:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"


    - name: Install requirements
      run: |
        pip install requests


    - name: Generate OTTPLUS playlist
      env:
        API_URL_ottplus: ${{ secrets.API_URL_ottplus }}
        API_KEY: ${{ secrets.API_KEY }}
      run: |
        python ott.py


    - name: Commit updated playlist
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"

        git add OTTPLUS.m3u8

        git commit -m "Auto update OTTPLUS playlist" || true

        git push
