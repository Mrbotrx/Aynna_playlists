name: OTTPLUS Update

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:


jobs:

  ottplus:

    runs-on: ubuntu-latest


    steps:

    - uses: actions/checkout@v4


    - uses: actions/setup-python@v5
      with:
        python-version: "3.x"


    - name: Install
      run: |
        pip install requests


    - name: Run OTT
      env:
        API_URL_ottplus: ${{ secrets.API_URL_ottplus }}
        API_KEY: ${{ secrets.API_KEY }}
      run: |
        python ott.py


    - name: Commit
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"

        git add OTTPLUS.m3u8

        git commit -m "Update playlist" || true

        git push
